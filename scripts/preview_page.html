<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBapo 预览</title>
<style>
:root {
  --bg: #f4f4f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #deded8;
  --accent: #2f6f5e; --accent-ink: #ffffff; --warn: #9a5b00; --bad: #a33a2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; align-items: baseline; gap: 12px; }
header h1 { font-size: 17px; margin: 0; }
header span { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
input[type=text], textarea, select { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
input[type=file] { width: 100%; font-size: 12px; }
button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.msg { font-size: 12px; margin-top: 8px; min-height: 1em; }
.msg.bad { color: var(--bad); }
.jobs { list-style: none; margin: 0; padding: 0; }
.jobs li { padding: 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between;
  gap: 8px; align-items: center; }
.jobs li:hover { background: var(--bg); }
.jobs li.active { background: #e6efec; }
.jobs .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.badge.done { color: var(--accent); border-color: var(--accent); }
.badge.failed { color: var(--bad); border-color: var(--bad); }
.badge.running { color: var(--warn); border-color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.controls > div { min-width: 140px; }
.controls label { margin-top: 0; }
.headline { font-size: 13px; margin: 10px 0 0; color: var(--muted); }
.warn { color: var(--warn); font-size: 12px; margin-top: 6px; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 14px; }
.page { width: 100%; max-width: 900px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.page svg { display: block; width: 100%; height: auto; }
details { margin-top: 12px; font-size: 12px; }
details pre { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto; }
table.kv { border-collapse: collapse; font-size: 12px; }
table.kv td { padding: 2px 10px 2px 0; vertical-align: top; }
table.kv td:first-child { color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header><h1>OpenBapo 预览</h1><span>后端测试工具 · 仅本机</span></header>
<main>
  <div>
    <section class="panel">
      <h2>上传</h2>
      <form id="upload">
        <label>音频（mp3 / m4a / ogg / opus / wav / flac，≤ 8 分钟）</label>
        <input type="file" name="audio" accept=".mp3,.m4a,.ogg,.opus,.wav,.flac" required>
        <label>歌名（可选）</label>
        <input type="text" name="title">
        <label>歌词（可选；附上则只对齐，不识别）</label>
        <textarea name="lyrics" placeholder="一行一句"></textarea>
        <div style="margin-top:10px"><button class="primary" type="submit">开始分析</button></div>
        <div class="msg" id="upmsg"></div>
      </form>
    </section>
    <section class="panel" style="margin-top:16px">
      <h2>任务</h2>
      <ul class="jobs" id="jobs"></ul>
    </section>
  </div>
  <section class="panel" id="view"><div class="empty">上传一首歌，或在左侧选择一个任务</div></section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
let current = null, opts = {transpose: 0, fingering: "", strum: "auto", simplify: "1"}, jobsCache = [];
const STATUS = {queued: "排队中", running: "分析中", done: "完成", failed: "失败"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function refreshJobs() {
  const r = await fetch("/api/jobs"); jobsCache = await r.json();
  const ul = $("#jobs"); ul.innerHTML = "";
  if (!jobsCache.length) ul.innerHTML = '<li style="cursor:default;color:var(--muted)">暂无</li>';
  for (const j of jobsCache) {
    const li = document.createElement("li");
    li.className = j.id === current ? "active" : "";
    const secs = j.status === "running" || j.status === "queued" ? ` ${Math.round(Date.now()/1000 - j.created)}s` : "";
    li.innerHTML = `<span class="t" title="${esc(j.title)}">${esc(j.title)}</span><span class="badge ${j.status}">${STATUS[j.status] || j.status}${secs}</span>`;
    li.onclick = () => select(j.id);
    ul.appendChild(li);
  }
  if (current) {
    const j = jobsCache.find(x => x.id === current);
    if (j && j.status !== "done" && $("#view").dataset.state !== j.status) showStatus(j);
    if (j && j.status === "done" && $("#view").dataset.state !== "done") loadSheet();
  }
}

function showStatus(j) {
  const v = $("#view"); v.dataset.state = j.status;
  const extra = j.status === "failed" ? `<p class="msg bad">${esc(j.error)}</p>` :
    '<p style="color:var(--muted)">分轨、节拍、和弦、调性、歌词……一首 4 分钟的歌大约需要 30–60 秒。</p>';
  v.innerHTML = `<h2>${esc(j.title)}</h2><p>${STATUS[j.status]}</p>${extra}
    <button onclick="removeJob('${j.id}')">删除任务</button>`;
}

function select(id) {
  current = id; opts = {transpose: 0, fingering: "", strum: "auto", simplify: "1"};
  const j = jobsCache.find(x => x.id === id);
  $("#view").dataset.state = "";
  if (j && j.status === "done") loadSheet(); else if (j) showStatus(j);
  refreshJobs();
}

function query() { return new URLSearchParams(opts).toString(); }

async function loadSheet() {
  const v = $("#view"); v.dataset.state = "done";
  const r = await fetch(`/api/jobs/${current}/sheet?${query()}`); const d = await r.json();
  if (d.error) { v.innerHTML = `<p class="msg bad">${esc(d.error)}</p>`; return; }
  const sel = d.fingering_options.find(o => o.selected);
  if (sel) opts.fingering = String(sel.tonic);
  opts.strum = opts.strum === "auto" ? "auto" : d.strum;
  const transposeOpts = Array.from({length: 13}, (_, i) => i - 6)
    .map(t => `<option value="${t}" ${t == opts.transpose ? "selected" : ""}>${t > 0 ? "+" + t : t} 半音</option>`).join("");
  const fingerOpts = d.fingering_options.map(o =>
    `<option value="${o.tonic}" ${o.selected ? "selected" : ""}>${esc(o.name)} 调指法（夹 ${o.capo} 品）${o.recommended ? " ★" : ""}${o.capo > 7 ? " 不推荐" : ""}</option>`).join("");
  const strumOpts = [`<option value="auto" ${opts.strum === "auto" ? "selected" : ""}>自动</option>`,
    `<option value="none" ${opts.strum === "none" ? "selected" : ""}>无（只标和弦变化）</option>`,
    ...d.strum_options.map(o => `<option value="${esc(o.id)}" ${opts.strum === o.id ? "selected" : ""}>${esc(o.name)}  ${esc(o.mnemonic)}${o.recommended ? " ★" : ""}</option>`)].join("");
  const s = d.summary, h = d.header;
  const t = s.timings ? Object.entries(s.timings).filter(([k]) => !k.includes(".")).map(([k, x]) => `${k} ${x.toFixed(1)}s`).join(" · ") : "";
  v.innerHTML = `
    <div class="controls">
      <div><label>演唱调</label><select id="c-transpose">${transposeOpts}</select></div>
      <div style="min-width:220px"><label>指法调</label><select id="c-fingering">${fingerOpts}</select></div>
      <div style="min-width:220px"><label>节奏型</label><select id="c-strum">${strumOpts}</select></div>
      <div><label>简化和弦</label><select id="c-simplify"><option value="1" ${opts.simplify === "1" ? "selected" : ""}>开</option><option value="0" ${opts.simplify === "0" ? "selected" : ""}>关</option></select></div>
      <div style="min-width:0"><button onclick="opts={transpose:0,fingering:'',strum:'auto',simplify:'1'};loadSheet()">重置</button></div>
      <div style="min-width:0;margin-left:auto">
        <button onclick="dl('png')">PNG</button> <button onclick="dl('pdf')">PDF</button> <button onclick="dl('musicxml')">MusicXML</button>
        <button onclick="removeJob('${current}')" style="margin-left:8px">删除</button>
      </div>
    </div>
    <p class="headline">${esc(h.text)} · ${esc(h.jianpu_key)} ${h.time_signature.join("/")} · ♩=${h.bpm ? Math.round(h.bpm) : "?"} · 渲染 ${d.render_seconds.toFixed(2)}s</p>
    ${d.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("")}
    <details><summary>分析详情</summary>
      <table class="kv">
        <tr><td>时长</td><td>${s.duration ? s.duration.toFixed(1) + " s" : "?"}</td></tr>
        <tr><td>小节 / 谱上和弦</td><td>${s.bars} / ${s.bar_chords}（低置信 ${s.low_confidence_chords}）</td></tr>
        <tr><td>调性置信度</td><td>${s.key_confidence == null ? "无" : s.key_confidence.toFixed(3)}</td></tr>
        <tr><td>歌词音节</td><td>${s.syllables}</td></tr>
        <tr><td>耗时</td><td>${esc(t)}</td></tr>
      </table>
      <pre>${s.lyrics.length ? s.lyrics.map(esc).join("\n") : "（无歌词）"}</pre>
    </details>
    <div class="pages">${d.pages.map(p => `<div class="page">${p}</div>`).join("")}</div>`;
  $("#c-transpose").onchange = e => { opts.transpose = e.target.value; loadSheet(); };
  $("#c-fingering").onchange = e => { opts.fingering = e.target.value; loadSheet(); };
  $("#c-strum").onchange = e => { opts.strum = e.target.value; loadSheet(); };
  $("#c-simplify").onchange = e => { opts.simplify = e.target.value; loadSheet(); };
}

function dl(fmt) { window.location = `/api/jobs/${current}/export/${fmt}?${query()}`; }

async function removeJob(id) {
  if (!confirm("删除这个任务？")) return;
  await fetch(`/api/jobs/${id}`, {method: "DELETE"});
  if (current === id) { current = null; $("#view").innerHTML = '<div class="empty">已删除</div>'; }
  refreshJobs();
}

$("#upload").onsubmit = async e => {
  e.preventDefault();
  const form = e.target, btn = form.querySelector("button"), msg = $("#upmsg");
  btn.disabled = true; msg.className = "msg"; msg.textContent = "上传中…";
  try {
    const r = await fetch("/api/jobs", {method: "POST", body: new FormData(form)});
    const d = await r.json();
    if (d.error) { msg.className = "msg bad"; msg.textContent = d.error; return; }
    msg.textContent = "已加入队列"; form.reset();
    await refreshJobs(); select(d.id);
  } catch (err) { msg.className = "msg bad"; msg.textContent = "上传失败：" + err; }
  finally { btn.disabled = false; }
};

refreshJobs(); setInterval(refreshJobs, 2000);
</script>
</body>
</html>
