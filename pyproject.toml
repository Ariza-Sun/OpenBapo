[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openbapo"
version = "0.0.1"
description = "Turn a song recording into a guitar play-along sheet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Reading printed guitar sheets (PDF / images) into the text sheet format.
sheets = [
    "numpy>=1.26",
    "pillow>=10",
    "pypdfium2>=4",
]
# Model inference. Kept out of the core package so arranging and rendering
# install without torch; also needs the ffmpeg command-line tools.
analysis = [
    "audioop-lts; python_version >= '3.13'",  # pydub (via lv-chordia) needs the removed stdlib module
    "beat-this>=1.1",
    "demucs>=4.1",
    "einops",
    "librosa>=0.10",
    "lv-chordia @ git+https://github.com/openmirlab/lv-chordia.git",
    "numpy>=1.26",
    "scipy>=1.10",
    "rotary-embedding-torch",
    "soxr",
    "torch>=2.1",
    "torchaudio>=2.1",  # imported by beat_this; must match the torch build (CPU / CUDA)
    "tqdm",
]
dev = [
    "hypothesis>=6.100",
    "librosa>=0.10",  # the rule-based chord experts are tested on CPU
    "mypy>=1.10",
    "numpy>=1.26",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
openbapo = "openbapo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openbapo"]

[tool.hatch.metadata]
# lv-chordia is only published on GitHub, so the analysis extra points at it directly.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/openbapo/analysis/chords/models/btc_vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/openbapo/sheet/omr.py" = ["RUF001", "RUF002", "RUF003"]  # the reading protocol is Chinese prose
"src/openbapo/sheet/reader.py" = ["RUF001", "RUF002", "RUF003"]
"src/openbapo/sheet/triage.py" = ["RUF001", "RUF002", "RUF003"]  # the triage table is Chinese
"tests/test_sheet_omr.py" = ["RUF001", "RUF002", "RUF003"]
"src/openbapo/arrange/strums.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_arrange_strums.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_sheet_triage.py" = ["RUF001", "RUF002", "RUF003"]
# The benchmark scripts write Chinese Markdown, where full-width punctuation is correct.
"scripts/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
# Model packages ship no type information and are imported lazily.
module = [
    "beat_this.*",
    "demucs.*",
    "librosa",
    "librosa.*",
    "lv_chordia.*",
    "pypdfium2",
    "pypdfium2.*",
    "scipy.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Third-party model code kept verbatim.
module = ["openbapo.analysis.chords.models.btc_vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not models"]
markers = [
    "models: needs model weights and the analysis extra; run with `pytest -m models`",
]
